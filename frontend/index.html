<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sistema de gestión de citas médicas de la Clínica San Antonio.">
  <meta name="theme-color" content="#0F172A">
  <title>Clínica San Antonio · Gestión de citas</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%231E3A8A'/%3E%3Cpath d='M17 10h6v7h7v6h-7v7h-6v-7h-7v-6h7z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/modules.css">
</head>
<body>
  <a class="salto-contenido" href="#vista">Saltar al contenido</a>

  <header class="barra-superior">
    <button class="boton-icono boton-menu" id="botonMenu" type="button" aria-label="Abrir menú" aria-controls="menuLateral" aria-expanded="false">
      <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>

    <a class="marca" href="#/inicio">
      <svg class="marca__logo" viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" rx="11" fill="#1E3A8A"/>
        <path d="M17 10h6v7h7v6h-7v7h-6v-7h-7v-6h7z" fill="#fff"/>
      </svg>
      <span class="marca__texto">
        <strong>Clínica San Antonio</strong>
        <small>Gestión de citas</small>
      </span>
    </a>

    <div class="selector-rol" id="selectorRol" role="group" aria-label="Cambiar rol activo">
      <button class="selector-rol__opcion" type="button" data-rol="paciente" aria-pressed="false">
        <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span class="selector-rol__texto">Paciente</span>
      </button>
      <button class="selector-rol__opcion" type="button" data-rol="medico" aria-pressed="false">
        <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3v5a5 5 0 0 0 10 0V3"/><path d="M10 13v2a5 5 0 0 0 10 0v-2.5"/><circle cx="20" cy="10.5" r="2"/></svg>
        <span class="selector-rol__texto">Médico</span>
      </button>
      <button class="selector-rol__opcion" type="button" data-rol="administrador" aria-pressed="false">
        <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>
        <span class="selector-rol__texto">Administrador</span>
      </button>
    </div>

    <div class="barra-superior__acciones">
      <div class="notificaciones">
        <button class="boton-icono" id="botonNotificaciones" type="button" aria-label="Notificaciones" aria-haspopup="true" aria-expanded="false" aria-controls="panelNotificaciones">
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
          <span class="contador" id="contadorNotificaciones" hidden>0</span>
        </button>
        <section class="panel-notificaciones" id="panelNotificaciones" aria-label="Notificaciones" hidden>
          <header class="panel-notificaciones__cabecera">
            <h2>Notificaciones</h2>
            <button class="boton boton--fantasma boton--pequeno" id="botonMarcarLeidas" type="button">Marcar todas como leídas</button>
          </header>
          <ul class="panel-notificaciones__lista" id="listaNotificaciones"></ul>
        </section>
      </div>

      <div class="usuario-actual">
        <span class="avatar avatar--claro" id="usuarioIniciales" aria-hidden="true"></span>
        <span class="usuario-actual__texto">
          <strong id="usuarioNombre"></strong>
          <small id="usuarioDetalle"></small>
        </span>
      </div>
    </div>
  </header>

  <div class="fondo-menu" id="fondoMenu" hidden></div>

  <div class="distribucion">
    <aside class="menu-lateral" id="menuLateral" aria-label="Menú principal">
      <nav class="menu-lateral__navegacion" id="navegacion"></nav>
      <footer class="menu-lateral__pie">
        <p class="menu-lateral__modo">
          <strong>Modo demostración</strong>
          Los datos se guardan en este navegador.
        </p>
        <button class="boton boton--secundario boton--pequeno boton--bloque" id="botonRestablecer" type="button">
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          Restablecer datos
        </button>
      </footer>
    </aside>

    <main class="vista" id="vista" tabindex="-1"></main>
  </div>

  <div id="capaModal"></div>
  <div class="contenedor-toast" id="contenedorToast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
