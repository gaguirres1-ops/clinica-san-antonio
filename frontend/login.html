<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ingreso al sistema de gestión de citas de la Clínica San Antonio.">
  <meta name="theme-color" content="#0F172A">
  <title>Iniciar sesión · Clínica San Antonio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%231E3A8A'/%3E%3Cpath d='M17 10h6v7h7v6h-7v7h-6v-7h-7v-6h7z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/modules.css">
</head>
<body class="acceso">
  <main class="acceso__distribucion">
    <section class="acceso__panel" aria-labelledby="tituloAcceso">
      <a class="acceso__marca" href="login.html">
        <svg class="marca__logo" viewBox="0 0 40 40" aria-hidden="true">
          <rect width="40" height="40" rx="11" fill="#1E3A8A"/>
          <path d="M17 10h6v7h7v6h-7v7h-6v-7h-7v-6h7z" fill="#fff"/>
        </svg>
        <strong>Clínica San Antonio</strong>
      </a>

      <div class="acceso__contenido">
        <h1 class="acceso__titulo" id="tituloAcceso">Iniciar sesión</h1>

        <div class="acceso__tipos" id="tiposDeAcceso" role="group" aria-label="Tipo de usuario">
          <button class="acceso__tipo" type="button" data-grupo="paciente" aria-pressed="true">Paciente</button>
          <button class="acceso__tipo" type="button" data-grupo="personal" aria-pressed="false">Personal</button>
        </div>

        <div class="aviso aviso--peligro" id="avisoAcceso" role="alert" hidden></div>

        <form class="acceso__formulario" id="formularioIngreso" novalidate>
          <div class="campo">
            <label class="campo__etiqueta" for="ingresoIdentificador" id="etiquetaIdentificador">DNI</label>
            <input class="entrada" id="ingresoIdentificador" name="identificador" type="text" inputmode="numeric" maxlength="8" autocomplete="username" placeholder="8 dígitos" required>
            <p class="campo__error" data-error-de="identificador" hidden></p>
          </div>
          <div class="campo">
            <label class="campo__etiqueta" for="ingresoContrasena">Contraseña</label>
            <div class="campo__contrasena">
              <input class="entrada" id="ingresoContrasena" name="contrasena" type="password" autocomplete="current-password" placeholder="Tu contraseña" required>
              <button class="campo__ver" type="button" data-accion="mostrar-contrasena" aria-label="Mostrar contraseña" aria-pressed="false"></button>
            </div>
            <p class="campo__error" data-error-de="contrasena" hidden></p>
          </div>
          <p class="campo__ayuda">DNI de prueba: 11111111 (paciente), 22222222 (médico) y 33333333 (administrador).</p>
          <button class="boton boton--primario boton--bloque" type="submit">Ingresar</button>
        </form>

        <form class="acceso__formulario" id="formularioRegistro" novalidate hidden>
          <div class="acceso__rejilla">
            <div class="campo">
              <label class="campo__etiqueta" for="registroDni">DNI</label>
              <input class="entrada" id="registroDni" name="dni" type="text" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="8 dígitos" required>
              <p class="campo__error" data-error-de="dni" hidden></p>
            </div>
            <div class="campo">
              <label class="campo__etiqueta" for="registroNacimiento">Fecha de nacimiento</label>
              <input class="entrada" id="registroNacimiento" name="fechaNacimiento" type="date" autocomplete="bday" required>
              <p class="campo__error" data-error-de="fechaNacimiento" hidden></p>
            </div>
            <div class="campo">
              <label class="campo__etiqueta" for="registroNombres">Nombres</label>
              <input class="entrada" id="registroNombres" name="nombres" type="text" autocomplete="given-name" required>
              <p class="campo__error" data-error-de="nombres" hidden></p>
            </div>
            <div class="campo">
              <label class="campo__etiqueta" for="registroApellidos">Apellidos</label>
              <input class="entrada" id="registroApellidos" name="apellidos" type="text" autocomplete="family-name" required>
              <p class="campo__error" data-error-de="apellidos" hidden></p>
            </div>
            <div class="campo">
              <label class="campo__etiqueta" for="registroSexo">Sexo</label>
              <select class="entrada" id="registroSexo" name="sexo" required>
                <option value="">Selecciona</option>
                <option value="F">Femenino</option>
                <option value="M">Masculino</option>
              </select>
              <p class="campo__error" data-error-de="sexo" hidden></p>
            </div>
            <div class="campo">
              <label class="campo__etiqueta" for="registroTelefono">Celular</label>
              <input class="entrada" id="registroTelefono" name="telefono" type="tel" inputmode="numeric" maxlength="11" autocomplete="tel-national" placeholder="9XX XXX XXX" required>
              <p class="campo__error" data-error-de="telefono" hidden></p>
            </div>
          </div>
          <div class="campo">
            <label class="campo__etiqueta" for="registroCorreo">Correo electrónico</label>
            <input class="entrada" id="registroCorreo" name="correo" type="email" autocomplete="email" required>
            <p class="campo__error" data-error-de="correo" hidden></p>
          </div>
          <div class="acceso__rejilla">
            <div class="campo">
              <label class="campo__etiqueta" for="registroContrasena">Contraseña</label>
              <div class="campo__contrasena">
                <input class="entrada" id="registroContrasena" name="contrasena" type="password" autocomplete="new-password" required>
                <button class="campo__ver" type="button" data-accion="mostrar-contrasena" aria-label="Mostrar contraseña" aria-pressed="false"></button>
              </div>
              <p class="campo__ayuda">Mínimo 8 caracteres, con letras y números.</p>
              <p class="campo__error" data-error-de="contrasena" hidden></p>
            </div>
            <div class="campo">
              <label class="campo__etiqueta" for="registroConfirmacion">Confirmar contraseña</label>
              <input class="entrada" id="registroConfirmacion" name="confirmacion" type="password" autocomplete="new-password" required>
              <p class="campo__error" data-error-de="confirmacion" hidden></p>
            </div>
          </div>
          <button class="boton boton--primario boton--bloque" type="submit">Crear cuenta</button>
        </form>

        <p class="acceso__alterno" id="alternoAcceso"></p>
      </div>
    </section>

    <aside class="acceso__lateral" aria-hidden="true">
      <svg class="acceso__simbolo" viewBox="0 0 40 40">
        <rect width="40" height="40" rx="11" fill="rgba(255,255,255,.1)"/>
        <path d="M17 10h6v7h7v6h-7v7h-6v-7h-7v-6h7z" fill="#fff"/>
      </svg>
      <p class="acceso__lema">Tu salud, nuestra prioridad</p>
    </aside>
  </main>

  <script type="module" src="js/acceso.js"></script>
</body>
</html>
